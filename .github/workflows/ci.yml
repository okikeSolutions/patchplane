name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchplane
          POSTGRES_PASSWORD: patchplane
          POSTGRES_DB: patchplane_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U patchplane -d patchplane_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PATCHPLANE_TEST_DATABASE_URL: postgresql://patchplane:patchplane@127.0.0.1:55432/patchplane_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run audit

      - run: bun run verify
