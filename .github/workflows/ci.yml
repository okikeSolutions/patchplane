name: Verify

# Temporarily manual-only (`workflow_dispatch`) while GitHub Actions private-repo
# quota is constrained; re-enable `pull_request:` once quota resets or a
# self-hosted Linux KVM runner is attached (`runs-on: [self-hosted, linux, kvm]`).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (static, unit, integration, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchplane
          POSTGRES_PASSWORD: patchplane
          POSTGRES_DB: patchplane_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U patchplane -d patchplane_test"
          --health-interval=1s
          --health-timeout=2s
          --health-retries=20
    env:
      PATCHPLANE_TEST_DATABASE_URL: postgresql://patchplane:patchplane@127.0.0.1:55432/patchplane_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.4-

      - run: bun install --frozen-lockfile

      - run: bun run audit

      - run: bun run verify
